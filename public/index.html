<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Tracking Online — Painel de ordens de serviço</title>
    <meta
      name="description"
      content="Acompanhe o TAT, LTP e EX-LTP das ordens de serviço em um só painel: análise por status, calendário de prazos, gráficos e projeção para os próximos dias."
    />
    <meta name="application-name" content="Tracking Online" />
    <meta name="author" content="Tracking Online" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="__SITE_URL__/" />

    <!-- Aparência do navegador / sistema -->
    <meta name="theme-color" content="#4f46e5" />
    <meta name="color-scheme" content="light" />
    <meta name="format-detection" content="telephone=no" />

    <!-- Ícones -->
    <link rel="icon" type="image/svg+xml" href="%PUBLIC_URL%/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="%PUBLIC_URL%/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="%PUBLIC_URL%/favicon-16.png" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" sizes="180x180" href="%PUBLIC_URL%/apple-touch-icon.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <!-- App instalado (iOS) -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Tracking" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <!-- Pré-visualização ao compartilhar (WhatsApp, Slack, LinkedIn, Facebook) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Tracking Online" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:title" content="Tracking Online — Painel de ordens de serviço" />
    <meta
      property="og:description"
      content="TAT, LTP e EX-LTP das ordens de serviço em um só painel, com análise por status, calendário de prazos e projeção futura."
    />
    <meta property="og:url" content="__SITE_URL__/" />
    <meta property="og:image" content="__SITE_URL__/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Painel Tracking Online com cartões de LTP e EX-LTP de VD e DA" />

    <!-- Pré-visualização ao compartilhar (X / Twitter) -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Tracking Online — Painel de ordens de serviço" />
    <meta
      name="twitter:description"
      content="TAT, LTP e EX-LTP das ordens de serviço em um só painel, com análise por status, calendário de prazos e projeção futura."
    />
    <meta name="twitter:image" content="__SITE_URL__/og-image.png" />
    <meta name="twitter:image:alt" content="Painel Tracking Online com cartões de LTP e EX-LTP de VD e DA" />

    <!-- Dados estruturados (Google) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Tracking Online",
        "url": "__SITE_URL__/",
        "description": "Painel de acompanhamento de ordens de serviço: TAT, LTP, EX-LTP e indicadores.",
        "applicationCategory": "BusinessApplication",
        "operatingSystem": "Web",
        "inLanguage": "pt-BR",
        "image": "__SITE_URL__/og-image.png"
      }
    </script>

    <!-- Fontes: conexão antecipada -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css?family=Roboto:300,400,500,700&display=swap"
    />

    <!-- Tela de carregamento: evita o clarão branco até o React montar -->
    <style>
      html, body { margin: 0; background: #f8fafc; }
      #boot {
        position: fixed; inset: 0; display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 18px;
        font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #64748b; font-size: 13px; letter-spacing: .02em;
      }
      #boot .mark { width: 56px; height: 56px; border-radius: 16px; animation: boot-pulse 1.4s ease-in-out infinite; }
      @keyframes boot-pulse { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(.92); opacity: .7; } }
      @media (prefers-reduced-motion: reduce) { #boot .mark { animation: none; } }
      #root:not(:empty) + #boot, #root:not(:empty) ~ #boot { display: none; }
    </style>
  </head>
  <body>
    <noscript>Ative o JavaScript no navegador para usar o Tracking Online.</noscript>
    <div id="root"></div>
    <div id="boot" aria-hidden="true">
      <img class="mark" src="%PUBLIC_URL%/favicon.svg" alt="" />
      <span>Carregando Tracking Online…</span>
    </div>
  </body>
</html>
